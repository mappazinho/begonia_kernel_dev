name: Build PoxaSuzaku (manual)

# Same build as D:/cos17/sa/ksu/build_poxa.sh rom|oc + make_sa_zip.py on the owner's PC:
# Ubuntu 24.04 clang 18.1.3, begonia_user_defconfig, ReSukiSU (KernelSU submodule) + SUSFS,
# stack protector on (the vendor's force-loaded udc_lib.ko imports __stack_chk_guard/__stack_chk_fail).
#   rom: -PoxaSuzaku     GPU stock 806 MHz (ROM boot.img / release zip)
#   oc:  -PoxaSuzaku-OC  GPU 850 MHz (CONFIG_BEGONIA_GPU_OC, personal build)
#   rom-noksu / oc-noksu: the same without KernelSU and SUSFS (tag -noksu; NoMount stays on)

# Manual only (Actions tab -> Run workflow); pushes run the branch's own build-kernel.yml.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: false
        default: ''
        type: string
      variants:
        description: 'Kernels to build (JSON list of rom, oc, rom-noksu, oc-noksu)'
        required: false
        default: '["rom","oc"]'
        type: string
      # Bench knobs; the defaults are the release build. Anything else tags the kernel release
      # and the zip name (e.g. -PoxaSuzaku-OC-a76), so the phone shows which variant runs.
      mtune:
        description: 'Instruction scheduling model (-mtune; -mcpu stays cortex-a55)'
        type: choice
        options: [cortex-a76, cortex-a55]
        default: cortex-a76
      opt:
        description: 'Optimization level'
        type: choice
        options: [O3, O2]
        default: O3
      polly:
        description: 'Polly loop optimizer (CONFIG_LLVM_POLLY)'
        type: boolean
        default: true
      inline:
        description: 'Raised inline thresholds (CONFIG_INLINE_OPTIMIZATION)'
        type: boolean
        default: true

jobs:
  build:
    name: PoxaSuzaku ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(github.event.inputs.variants || '["rom","oc"]') }}

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch || github.ref_name }}
        submodules: true

    # KernelSU's Kbuild derives its version from git: rev-list --count (needs full history) and
    # describe --tags (the tags live upstream). The submodule commit itself is on this repo's
    # resukisu-sucompat branch (ReSukiSU v4.2.0-rc1 + the 4.14 SUSFS su-compat fix).
    - name: KernelSU history and tags
      run: |
        git -C KernelSU fetch --unshallow -q || true
        git -C KernelSU fetch -q --tags https://github.com/ReSukiSU/ReSukiSU
        echo "KernelSU $(git -C KernelSU rev-parse --short=8 HEAD) $(git -C KernelSU describe --abbrev=0 --tags) count $(git -C KernelSU rev-list --count HEAD)"

    - name: Toolchain
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q clang-18 lld-18 llvm-18 bc bison flex libssl-dev libelf-dev cpio zip python3 device-tree-compiler
        for t in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip; do sudo ln -sf /usr/bin/$t-18 /usr/local/bin/$t; done
        clang --version | head -1

    - name: Bench knobs
      run: |
        MTUNE=${{ github.event.inputs.mtune || 'cortex-a76' }}; OPT=${{ github.event.inputs.opt || 'O3' }}
        POLLY=${{ github.event.inputs.polly || 'true' }}; INLINE=${{ github.event.inputs.inline || 'true' }}
        case "${{ matrix.variant }}" in
          rom) GPU=stock; KSU=true;; oc) GPU=oc; KSU=true;;
          rom-noksu) GPU=stock; KSU=false;; oc-noksu) GPU=oc; KSU=false;;
          *) echo "::error::unknown variant '${{ matrix.variant }}' (rom, oc, rom-noksu, oc-noksu)"; exit 1;;
        esac
        echo "GPU=$GPU" >> $GITHUB_ENV
        T=""
        [ $MTUNE = cortex-a55 ] && T="$T-a55"
        [ $OPT = O2 ] && T="$T-O2"
        [ $POLLY = false ] && T="$T-nopolly"
        [ $INLINE = false ] && T="$T-noinline"
        [ $KSU = false ] && T="$T-noksu"
        echo "KSU=$KSU" >> $GITHUB_ENV
        echo "TAG=$T" >> $GITHUB_ENV
        echo "POLLY=$POLLY" >> $GITHUB_ENV; echo "INLINE=$INLINE" >> $GITHUB_ENV
        echo "KNOBS=POXA_MTUNE=$MTUNE POXA_OPT=-$OPT" >> $GITHUB_ENV
        echo "variant tag: '${T:-none (release)}'  gpu=$GPU ksu=$KSU mtune=$MTUNE opt=-$OPT polly=$POLLY inline=$INLINE"

    - name: Configure
      run: |
        if [ $GPU = stock ]; then LV=-PoxaSuzaku$TAG; else LV=-PoxaSuzaku-OC$TAG; fi
        make O=out ARCH=arm64 LLVM=1 CC=clang begonia_user_defconfig
        sed -i -e '/^CONFIG_LOCALVERSION=/d' -e '/CONFIG_BEGONIA_GPU_OC/d' out/.config
        echo "CONFIG_LOCALVERSION=\"$LV\"" >> out/.config
        if [ $GPU = oc ]; then echo CONFIG_BEGONIA_GPU_OC=y; else echo '# CONFIG_BEGONIA_GPU_OC is not set'; fi >> out/.config
        [ $POLLY = true ] || ./scripts/config --file out/.config --disable LLVM_POLLY
        [ $INLINE = true ] || ./scripts/config --file out/.config --disable INLINE_OPTIMIZATION
        [ $KSU = true ] || ./scripts/config --file out/.config --disable KSU   # SUSFS depends on it
        make O=out ARCH=arm64 LLVM=1 CC=clang olddefconfig
        grep -E 'CONFIG_(LOCALVERSION|BEGONIA_GPU_OC|CC_STACKPROTECTOR_STRONG|KSU|KSU_SUSFS|KSU_SUSFS_SUS_MOUNT|OPLUS_FEATURE_SCHED_ASSIST|LLVM_POLLY|INLINE_OPTIMIZATION)[= ]|(BEGONIA_GPU_OC|LLVM_POLLY|INLINE_OPTIMIZATION) is not' out/.config
        grep -q '^CONFIG_CC_STACKPROTECTOR_STRONG=y' out/.config
        ! grep -q '^CONFIG_KSU_SUSFS_SUS_MOUNT=y' out/.config
        grep -q '^CONFIG_NOMOUNT=y' out/.config || { echo "::error::CONFIG_NOMOUNT is off"; exit 1; }
        if [ $KSU = true ]; then grep -q '^CONFIG_KSU_SUSFS=y' out/.config; else ! grep -q -E '^CONFIG_KSU(_SUSFS)?=y' out/.config; fi

    - name: Build
      run: |
        make -j$(nproc) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
          LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM=1 LLVM_IAS=1 \
          CFLAGS_KERNEL=-fintegrated-as CFLAGS_MODULE=-fintegrated-as $KNOBS
        # the knobs really reached the compiler
        grep -o -E -- '-O[23] |-mcpu=[^ ]+|-mtune=[^ ]+' out/kernel/.fork.o.cmd | sort -u

    - name: Check image
      run: |
        python3 - <<'PY'
        import re, zlib
        k = open('out/arch/arm64/boot/Image.gz-dtb', 'rb').read()
        d = zlib.decompressobj(16 + zlib.MAX_WBITS); img = d.decompress(k) + d.flush()
        assert d.unused_data[:4] == b'\xd0\x0d\xfe\xed', 'no DTB after the gzip stream'
        ver = re.search(rb'Linux version [^\n\x00]+', img).group(0).decode(); print(ver)
        import os
        want = ('-PoxaSuzaku-OC' if os.environ['GPU'] == 'oc' else '-PoxaSuzaku') + os.environ['TAG']
        assert ver.split()[2].endswith(want), ver
        if os.environ['KSU'] == 'true':
            assert b'v4.2.0-rc1-023987f9@ReSukiSU' in img, 'not ReSukiSU v4.2.0-rc1 + su-compat fix'
            assert b'susfs is initialized! version: v2.4.0' in img
        else:
            assert b'@ReSukiSU' not in img and b'susfs is initialized' not in img, 'KernelSU/SUSFS in a no-KSU build'
        syms = {l.split('\t')[1] for l in open('out/Module.symvers') if '\t' in l}
        for s in ('__stack_chk_guard', '__stack_chk_fail', 'register_udc_functions', 'memset', 'printk'):
            assert s in syms, 'kernel does not export %s (udc_lib.ko would not load)' % s
        print('checks ok')
        PY

    - name: AnyKernel3 zip
      run: |
        if [ $GPU = stock ]; then
          N=PoxaSuzaku; KS='PoxaSuzaku (Suzaku V2 + SchedAssist + ReSukiSU + SUSFS)'
        else
          N=PoxaSuzaku-OC; KS='PoxaSuzaku OC (Suzaku V2 + SchedAssist + ReSukiSU + SUSFS, personal build, GPU 850 MHz)'
        fi
        [ $KSU = true ] || KS="${KS/ + ReSukiSU + SUSFS/, no KernelSU}"
        [ -n "$TAG" ] && KS="$KS [variant ${TAG#-}]"
        Z=$N$TAG-$(date -u +%Y%m%d)-${GITHUB_SHA::8}
        rm -rf AnyKernel3 && cp -a anykernel-template AnyKernel3
        sed -i "s|^kernel\.string=.*|kernel.string=$KS|" AnyKernel3/anykernel.sh
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        (cd AnyKernel3 && zip -qr9 ../$Z.zip . -x '.git*')
        sha256sum $Z.zip out/arch/arm64/boot/Image.gz-dtb
        echo "ZIP=$Z" >> $GITHUB_ENV

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ZIP }}
        path: ${{ env.ZIP }}.zip

    # Anonymous upload unless the repo has a GOFILE_TOKEN secret (gofile.io account API token);
    # GOFILE_FOLDER (optional secret) puts every upload into one folder of that account.
    - name: Upload to gofile
      env:
        GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
        GOFILE_FOLDER: ${{ secrets.GOFILE_FOLDER }}
      run: |
        A=(); [ -n "$GOFILE_TOKEN" ] && A+=(-H "Authorization: Bearer $GOFILE_TOKEN")
        F=(); [ -n "$GOFILE_TOKEN" ] && [ -n "$GOFILE_FOLDER" ] && F+=(-F "folderId=$GOFILE_FOLDER")
        R=$(curl -sS --retry 3 "${A[@]}" -F "file=@$ZIP.zip" "${F[@]}" https://upload.gofile.io/uploadfile)
        URL=$(echo "$R" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["status"]=="ok", d; print(d["data"]["downloadPage"])') \
          || { echo "::error::gofile upload failed: $R"; exit 1; }
        echo "$ZIP.zip: $URL"
        echo "**$ZIP.zip**: $URL  " >> $GITHUB_STEP_SUMMARY
